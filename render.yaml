services:
  - type: web
    name: twitter-feed-api
    runtime: docker
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: twitter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: twitter-redis
          property: connectionString
      - key: API_KEY
        generateValue: true
  - type: redis
    name: twitter-redis
    plan: starter
    ipAllowList: []

databases:
  - name: twitter-db
    plan: basic-256mb
    postgresMajorVersion: "15"
